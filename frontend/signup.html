<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - BEHAVE-SEC</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/signup.css">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <!-- Background shapes -->
    <div class="signup-container">
        <div class="signup-header">
            <h2>Create Account</h2>
            <p>Join BEHAVE - SEC today</p>
        </div>
        <form class="signup-form" onsubmit="handleSignup(event)">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="your.email@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Confirm your password" required>
            </div>
            <div class="terms-checkbox">
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy
                        Policy</a></label>
            </div>
            <button type="submit" class="signup-btn">Sign Up</button>
        </form>
        <div class="divider">Or continue with</div>

        <!-- Google Identity Services — declarative mode -->
        <div id="g_id_onload"
             data-client_id="712400673827-4d3u6bi41fs47nqs4urjntv6ib3712hu.apps.googleusercontent.com"
             data-callback="handleGoogleSignUpCredential"
             data-auto_select="false"
             data-cancel_on_tap_outside="true">
        </div>

        <!-- Full-width Google button -->
        <div class="g_id_signin"
             data-type="standard"
             data-theme="filled_black"
             data-size="large"
             data-shape="rectangular"
             data-text="signup_with"
             data-logo_alignment="left"
             data-width="360"
             style="display:flex;justify-content:center;margin-bottom:0.5rem;">
        </div>

        <div class="social-login" style="justify-content:center;">
            <button class="social-btn" disabled style="opacity:0.35;cursor:not-allowed;flex:none;padding:0.55rem 1.2rem;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.17 6.839 9.49.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.604-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.167 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>
                GitHub (coming soon)
            </button>
        </div>

        <div class="login-link">
            Already have an account? <a href="login.html">Log In</a>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/signup.js"></script>
    <script src="js/settings.js"></script>
</body>

</html>
